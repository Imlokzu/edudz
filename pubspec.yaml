name: edudz
description: edudz — your school day, beautifully simple. Self-hosted EduPage client.
publish_to: none
version: 2.3.0+31
environment:
  sdk: ^3.2.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.9.0
  path_provider: ^2.1.5
  flutter_pdfview: ^1.4.3
  flutter_markdown_plus: ^1.0.12
  crypto: ^3.0.6
  archive: ^4.0.7
  xml: ^6.6.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  flutter_session_manager: ^1.0.3
  connectivity_plus: ^7.0.0
  intl: ^0.20.2
  html_unescape: ^2.0.0
  flutter_cached_pdfview: ^0.4.3
  url_launcher: ^6.3.2
  flutter_linkify: ^6.0.0
  app_links: ^6.4.1
  toastification: ^3.0.3
  auto_size_text: ^3.0.0
  introduction_screen: ^4.0.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - assets/EduPage2/png/logo-no-background.png
    - assets/demo/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
  generate: true
  uses-material-design: true
